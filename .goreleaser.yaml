# Release by hand: GITHUB_TOKEN="$(gh auth token)" goreleaser release --clean
version: 2

builds:
  - main: ./cmd/ecd
    binary: ecd
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# A cask, not a formula: goreleaser 2.16 retired brews. The binary is not signed
# or notarized (that needs a paid Apple account), so until it is, the custom
# block clears macOS's quarantine flag after install. It is a custom_block
# because goreleaser's hooks emit postflight, which Homebrew 7 deprecates.
homebrew_casks:
  - name: easy-cd
    binaries: [ecd]
    repository:
      owner: banozz0
      name: homebrew-tap
    homepage: https://github.com/banozz0/easy-cd
    description: "Terminal folder picker: arrow keys to walk, type to search, Enter to cd"
    license: MIT
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/ecd"]
        end
      end
    caveats: |
      Add eval "$(ecd init zsh)" (or bash, or fish) to your shell's config.
      Run ecd init to see the exact line and file for each shell.
